name: Scheduled Data Fetch

# Fetches CBS News House race ratings and commits the CSV.
#
# The source feed (partners.elections.cbsnews.com) sits behind a CloudFront
# WAF that only allows requests from CBS's network/VPN. GitHub-hosted runners
# can't reach it, so the cron schedule is disabled — run scripts/fetch.py
# manually from a machine on CBS VPN instead. workflow_dispatch is kept in
# case this ever runs from a self-hosted runner on CBS's network.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync

    - name: Fetch data
      run: uv run python scripts/fetch.py

    - name: Commit updated data
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed/house_races.csv
        git diff --cached --quiet || git commit -m "chore: refresh House race ratings [$(date -u +%Y-%m-%d)]"
        git push

name: Scheduled Data Fetch

# Fetches CBS News House race ratings twice a day and commits the CSV.
# Cron syntax: minute hour day-of-month month day-of-week (UTC)
#   '0 11,23 * * *' → 11am and 11pm UTC (7am / 7pm ET)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11,23 * * *'

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      run: uv python install 3.13

    - name: Install dependencies
      run: uv sync

    - name: Fetch data
      run: uv run python scripts/fetch.py

    - name: Commit updated data
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/processed/house_races.csv
        git diff --cached --quiet || git commit -m "chore: refresh House race ratings [$(date -u +%Y-%m-%d)]"
        git push

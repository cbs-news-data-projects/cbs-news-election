name: Probe Senate feed reachability

# One-off manual check: can a GitHub-hosted runner reach the public Senate
# ratings feed? Actions was dropped for this project on 2026-09-11 after
# this same feed was blocked from a runner (see commit 83b434c). CBS's edge
# has been intermittent/brittle before, so this exists to re-test cheaply
# without wiring up real fetch/commit automation. No checkout, no deps,
# just a status code. Delete this file once the question is answered.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl the Senate feed and print the HTTP status
        run: |
          code=$(curl -s -o /tmp/body.json -w "%{http_code}" -m 30 \
            "https://www.cbsnews.com/election-api/2026/pre-election-senate-races.json")
          echo "HTTP status: $code"
          echo "Response size: $(wc -c < /tmp/body.json) bytes"
          head -c 300 /tmp/body.json
          echo
          if [ "$code" -ne 200 ]; then
            echo "::error::Feed did not return 200 (got $code)"
            exit 1
          fi
